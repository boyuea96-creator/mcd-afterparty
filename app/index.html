<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AfterM · 麦麦散场局</title>
<style>
:root{
  --bg:#0A0A0B; --card:#131315; --card2:#17171A; --line:#232326; --line2:#2E2E32;
  --tx:#F5F5F7; --tx2:#9A9AA0; --tx3:#6B6B72;
  --y:#FFC72C; --y-dim:rgba(255,199,44,.14);
  --red:#DA291C; --red-lt:#F0715F; --red-dim:rgba(218,41,28,.13);
  --r:14px;
}
*{box-sizing:border-box;-webkit-font-smoothing:antialiased}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Helvetica Neue",Arial,sans-serif;
  line-height:1.6; letter-spacing:.1px;
}
[hidden]{display:none!important}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit;color:inherit;background:none;border:0;outline:0}
::selection{background:var(--y);color:#000}

.screen{max-width:760px;margin:0 auto;padding:0 30px 80px}

/* ---------- 第一屏 ---------- */
.hero{
  position:relative;overflow:hidden;padding:44px 0 54px;
  background:linear-gradient(180deg,#DA291C 0%,#D32619 62%,#C42218 100%);
}
/* 红块下沿金线：两端淡出、中间略亮 —— 一条实心黄条会像贴纸，收口要有呼吸 */
.hero::after{
  content:"";position:absolute;left:0;right:0;bottom:0;height:4px;pointer-events:none;
  background:linear-gradient(90deg,
    rgba(255,199,44,.34) 0%, rgba(255,199,44,.70) 14%,
    #FFC72C 38%, #FFE08A 50%, #FFC72C 62%,
    rgba(255,199,44,.70) 86%, rgba(255,199,44,.34) 100%);
  background:linear-gradient(90deg,
    rgba(255,199,44,0) 0%, rgba(255,199,44,.58) 10%,
    #FFC72C 34%, #FFE08A 50%, #FFC72C 66%,
    rgba(255,199,44,.58) 90%, rgba(255,199,44,0) 100%);
}
.hero-in{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:0 30px}
.brand{display:flex;align-items:center;gap:13px}
.brand .arch{width:40px;height:auto;display:block}
.brand .bn{font-size:17px;font-weight:700;letter-spacing:.4px;line-height:1.1;color:#fff}
.brand .bs{font-size:11.5px;color:rgba(255,255,255,.6);letter-spacing:2.2px;margin-top:3px}
.h1{font-size:46px;line-height:1.18;font-weight:700;letter-spacing:-1.2px;margin:44px 0 16px;color:#fff}
.h1 em{font-style:normal;color:var(--y)}
.sub{font-size:15.5px;color:rgba(255,255,255,.74);margin:0}
.formwrap{padding-top:46px}

.sec-label{
  font-size:11.5px;font-weight:700;letter-spacing:2.4px;color:var(--tx3);
  text-transform:uppercase;margin:0 0 20px;display:flex;align-items:center;gap:10px;
}
.sec-label::after{content:"";flex:1;height:1px;background:var(--line)}
.sec-label span{letter-spacing:0;text-transform:none;font-weight:400;color:var(--tx3);font-size:11.5px}
.sel-sec{margin-top:44px}

.field{padding:0 0 22px}
.field>label{display:block;font-size:12.5px;color:var(--tx3);margin-bottom:9px;letter-spacing:.3px}
.field .row{display:flex;align-items:center;gap:14px}
.inp{
  flex:1;min-width:0;width:100%;font-size:19px;font-weight:500;padding:6px 0 11px;
  border-bottom:1px solid var(--line2);transition:border-color .2s;
}
.inp::placeholder{color:#4A4A50;font-weight:400}
.inp:focus{border-bottom-color:var(--y)}
.mini{
  font-size:12.5px;color:var(--tx2);border:1px solid var(--line2);border-radius:999px;
  padding:6px 13px;white-space:nowrap;transition:.18s;
}
.mini:hover{color:var(--tx);border-color:#4A4A50}

.stepper{display:flex;align-items:center;gap:2px}
.stepper button{
  width:44px;height:44px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  font-size:20px;color:var(--tx2);transition:.16s;
}
.stepper button:hover{color:var(--tx);border-color:#3A3A40}
.stepper .num{min-width:64px;text-align:center;font-size:26px;font-weight:600;letter-spacing:-.5px}
.stepper .unit{color:var(--tx3);font-size:13px;margin-left:6px}

.seg3{display:flex;gap:10px}
.seg{
  flex:1;padding:15px 0;border-radius:var(--r);background:var(--card);border:1px solid var(--line);
  font-size:15.5px;font-weight:600;color:var(--tx2);transition:.18s;text-align:center;
}
.seg:hover{border-color:#3A3A40;color:var(--tx)}
.seg.on{background:var(--y);border-color:var(--y);color:#141000;box-shadow:0 6px 24px rgba(255,199,44,.18)}
.seg small{display:block;font-size:11px;font-weight:500;opacity:.62;margin-top:2px;letter-spacing:.3px}

.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.chip{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line2);
  font-size:13.5px;color:var(--tx2);transition:.16s;background:transparent;
}
.chip:hover{border-color:#454549;color:var(--tx)}
.chip.on{background:var(--y-dim);border-color:rgba(255,199,44,.6);color:var(--y)}
.chip:disabled{opacity:.28;cursor:not-allowed}
.chip-note{font-size:11.5px;color:var(--tx3);margin-top:9px;line-height:1.7}.chip-note .auto{color:var(--y);opacity:.9}
.lab-note{font-size:11px;color:#6A6A72;font-weight:400;margin-left:9px;letter-spacing:0}

/* 必填没填够：一次说清缺哪几项，不玩「请填写完整」 */
.formerr{margin:4px 0 18px;padding:15px 17px;border-radius:10px;
  border:1px solid rgba(218,41,28,.34);background:rgba(218,41,28,.05);
  font-size:13px;line-height:1.9;color:#DCA79F}
.formerr b{display:block;font-size:13.5px;color:#F0715F;margin-bottom:5px}
.formerr span{display:inline-block;margin-right:16px;cursor:pointer;
  border-bottom:1px dashed rgba(240,113,95,.55);padding-bottom:1px}
.inp.err,.price-inp.err{border-color:rgba(218,41,28,.62)!important}

/* 偏好兑现条：不用色块，只用一根左边线，低调但绕不开 */
.prefwrap{margin:0 0 24px}
.pf{display:flex;align-items:baseline;gap:12px;padding:13px 0 13px 14px;
  border-left:2px solid var(--line2);margin-bottom:2px}
.pf b{font-size:14px;font-weight:600;white-space:nowrap}
.pf span{font-size:12px;color:var(--tx3);line-height:1.6}
.pf.ok{border-left-color:var(--y)}
.pf.ok b{color:var(--y)}
.pf.miss{border-left-color:rgba(218,41,28,.75)}
.pf.miss b{color:#F0715F}
.pf.warn{border-left-color:rgba(218,41,28,.45)}
.pf.warn b{color:#E7A79E}

.quick{display:flex;gap:8px;margin-left:auto}
.quick button{
  padding:8px 15px;border-radius:999px;border:1px solid var(--line2);
  font-size:13.5px;color:var(--tx2);transition:.16s;background:transparent;
}
.quick button:hover{border-color:#454549;color:var(--tx)}
.quick button.on{background:var(--y-dim);border-color:rgba(255,199,44,.6);color:var(--y)}
.price-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.price-inp{width:120px;font-size:19px;font-weight:600;padding:6px 0 10px;border-bottom:1px solid var(--line2)}
.price-row .unit{color:var(--tx3);font-size:13px;margin-left:-6px}

.cta{
  width:100%;margin-top:38px;padding:19px 0;border-radius:16px;
  background:var(--y);color:#141000;font-size:17px;font-weight:700;letter-spacing:.5px;
  transition:.18s;box-shadow:0 10px 34px rgba(255,199,44,.16);
}
.cta:hover{background:#FFD453;transform:translateY(-1px)}
.cta:active{transform:translateY(0)}
.cta[disabled]{opacity:.55;cursor:progress;transform:none}
.form-foot{text-align:center;font-size:11.5px;color:var(--tx3);margin-top:16px}

/* ---------- 计算中 ---------- */
.loading{padding:100px 0;text-align:center}
.ld-num{font-size:52px;font-weight:800;letter-spacing:-2px;color:var(--y);font-variant-numeric:tabular-nums}
.ld-num small{font-size:15px;font-weight:500;color:var(--tx3);margin-left:6px;letter-spacing:0}
.ld-bar{width:220px;height:3px;background:var(--line);border-radius:2px;margin:26px auto 0;overflow:hidden}
.ld-bar i{display:block;height:100%;width:30%;background:var(--y);border-radius:2px;
  animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(430%)}}
.ld-tip{margin-top:24px;font-size:13.5px;color:var(--tx2);min-height:22px}
.ld-sub{margin-top:8px;font-size:11.5px;color:var(--tx3)}

/* ---------- 第二屏 ---------- */
.topbar{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
  padding:16px 0;margin-bottom:2px;background:rgba(10,10,11,.86);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
}
.back{font-size:13.5px;color:var(--tx2);transition:.16s;white-space:nowrap}
.back:hover{color:var(--y)}
.sumchips{display:flex;gap:7px;flex-wrap:wrap;margin-left:auto;justify-content:flex-end}
.sumchip{font-size:11.5px;color:var(--tx3);border:1px solid var(--line);border-radius:999px;padding:4px 10px}

.lazybar{display:flex;align-items:baseline;gap:9px;margin:26px 0 0;font-size:12.5px;color:var(--tx3)}
.lazybar b{color:var(--tx2);font-weight:600}
.lb-dash{width:14px;height:1px;background:var(--y);display:inline-block;flex:none;transform:translateY(-4px)}

.vcard{
  position:relative;margin:16px 0 4px;padding:22px 28px 26px;border-radius:18px;overflow:hidden;
  background:radial-gradient(130% 120% at 100% 0%,rgba(255,199,44,.10) 0%,rgba(255,199,44,0) 58%),
             linear-gradient(158deg,#171308 0%,#121110 46%,#0E0E0F 100%);
  border:1px solid #2B2620;
  box-shadow:0 18px 50px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.03);
}
.vcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
  background:linear-gradient(180deg,var(--y) 0%,var(--y) 46%,var(--red) 100%)}
.vwm{position:absolute;right:-30px;bottom:-38px;width:196px;opacity:.06;pointer-events:none}
.vlabel{display:inline-flex;align-items:center;gap:7px;position:relative;z-index:1;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:800;letter-spacing:2.2px;
  padding:5px 11px;border-radius:3px}
.vlabel::before{content:"";width:4px;height:4px;border-radius:50%;background:#fff;opacity:.9}

.verdict{position:relative;z-index:1;padding-top:18px}
.verdict .vt{font-size:33px;line-height:1.34;font-weight:800;letter-spacing:-.9px;margin:0;color:#FAFAFB}
.verdict .vt .em{
  font-weight:800;letter-spacing:1.5px;
  background:linear-gradient(96deg,#FFF3CE 0%,#FFC72C 50%,#FFA81A 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,199,44,.38));
}
.verdict .vmeta{display:flex;align-items:baseline;gap:14px;margin-top:20px;
  padding-top:18px;border-top:1px solid rgba(255,199,44,.14)}
.verdict .vprice{font-size:31px;font-weight:800;letter-spacing:-1px;color:var(--y);
  font-variant-numeric:tabular-nums;line-height:1}
.verdict .vper{font-size:13px;color:var(--tx3)}
.verdict .vper b{color:var(--tx2);font-weight:500}
.verdict .vtags{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}
.verdict .vtags span{font-size:12px;color:var(--tx2);border:1px solid #2C2823;border-radius:999px;
  padding:4px 11px;background:rgba(255,255,255,.02)}
.verdict .vtags span.hot{color:var(--red-lt);border-color:rgba(218,41,28,.32);background:rgba(218,41,28,.09)}
.verdict .vtags span.gap{color:var(--red-lt);border-color:rgba(218,41,28,.3);background:rgba(218,41,28,.08)}
.verdict .vs{font-size:14.5px;color:var(--tx2);margin:16px 0 0}
.verdict .vlead{font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.6;color:var(--tx);
  margin:0 0 4px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,.06)}
.verdict .vlead .dgap{color:var(--red-lt);font-weight:800}
.verdict .vrow{display:grid;grid-template-columns:58px 1fr auto;gap:14px;align-items:start;
  padding:15px 0;border-top:1px solid rgba(255,255,255,.055)}
.verdict .vrow:first-child{border-top:0;padding-top:4px}
.verdict .vrow .k{font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--tx2);
  border-left:3px solid var(--y);padding:2px 0 2px 9px;line-height:1.5}
.verdict .vrow .v{font-size:15px;color:var(--tx2);line-height:1.7}
.verdict .vrow .vp{font-size:19px;font-weight:800;color:var(--y);white-space:nowrap;
  font-variant-numeric:tabular-nums;line-height:1.35;text-align:right}
.verdict .vrow .vp small{font-size:11px;font-weight:400;color:var(--tx3);margin-left:2px}

.switch{display:flex;gap:8px;margin:24px 0 4px}
.switch button{
  flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  font-size:14.5px;font-weight:600;color:var(--tx2);transition:.18s;text-align:left;
}
.switch button .sp{float:right;font-size:12.5px;font-weight:500;color:var(--tx3);padding-top:2px}
.switch button.on{border-color:rgba(255,199,44,.55);background:var(--y-dim);color:var(--y)}
.switch button.on .sp{color:rgba(255,199,44,.75)}

.block{margin-top:34px}
.bh{display:flex;align-items:baseline;gap:9px;margin-bottom:15px}
.bh .idx{font-size:11px;color:var(--tx3);letter-spacing:1.6px;font-weight:700}
.bh .bt{font-size:15.5px;font-weight:700;letter-spacing:.2px}
.bh .bj{font-size:11.5px;color:var(--tx3);margin-left:auto;text-align:right}

.coupon{display:flex;gap:13px;align-items:flex-start;padding:15px 17px;border-radius:12px;
  background:var(--card);border:1px solid var(--line)}
.coupon .ci{flex:none;width:26px;height:26px;border-radius:7px;border:1px solid rgba(255,199,44,.42);
  color:var(--y);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.coupon .ct{font-size:13.5px;color:var(--tx2);line-height:1.66}
.coupon .ct b{color:var(--tx);font-weight:600}
.coupon .ct .dim{color:var(--tx3);font-size:12.5px}

.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{text-align:left;font-size:11px;font-weight:600;letter-spacing:1.2px;color:var(--tx3);
  padding:0 0 10px;border-bottom:1px solid var(--line)}
.tbl th.r,.tbl td.r{text-align:right}
.tbl th.tg{padding-left:24px;min-width:96px}
.tbl th.r{min-width:96px}
.tbl td{padding:15px 0;border-bottom:1px solid #1A1A1D;vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td.nm{font-size:14.5px;font-weight:600;color:var(--tx);padding-right:14px}
.tbl td.nm .sub2{display:block;font-size:12px;font-weight:400;color:var(--tx3);margin-top:4px;line-height:1.55}
.tbl td.pr{font-size:16px;font-weight:700;white-space:nowrap;padding-left:12px}
.tbl td.pr .pp{display:block;font-size:11.5px;font-weight:400;color:var(--tx3);margin-top:3px}
.tbl td.tg{padding-left:16px;width:104px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:5px;margin:0 4px 4px 0;white-space:nowrap}
.t-best{background:var(--y-dim);color:var(--y);border:1px solid rgba(255,199,44,.32)}
.t-gray{background:#1D1D20;color:var(--tx3);border:1px solid #2C2C31}
.t-hot{background:rgba(218,41,28,.14);color:#F0715F;border:1px solid rgba(218,41,28,.32)}

.ways{margin-top:2px}
.whead{font-size:12.5px;color:var(--tx3);padding-bottom:12px;border-bottom:1px solid var(--line)}
.whead b{color:var(--tx);font-weight:600}
.wrow{display:grid;grid-template-columns:1fr 62px 96px;gap:14px;align-items:baseline;
  padding:13px 0;border-bottom:1px solid #1A1A1D}
.wrow:last-of-type{border-bottom:0}
.wrow .wn{font-size:14px;font-weight:600;color:var(--tx);line-height:1.4}
.wrow .wn small{display:block;font-weight:400;font-size:11.5px;color:var(--tx3);margin-top:5px;line-height:1.5}
.wrow .wt{font-size:14px;color:var(--tx2);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.wrow .wc{font-size:13.5px;color:var(--tx2);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.wrow .wn .tag{margin-left:8px;vertical-align:1px}
.wrow.best .wt{color:var(--tx);font-weight:700}
.wrow.best .wc{color:var(--y)}
.waynote{margin-top:13px;font-size:11.5px;color:var(--tx3);line-height:1.6}
.waynote b{color:var(--tx2);font-weight:500}

.transit{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tcard{padding:15px 17px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.tcard .tt{font-size:11.5px;color:var(--tx3);letter-spacing:.6px;margin-bottom:8px}
.tcard .tv{font-size:19px;font-weight:700}
.tcard .tv small{font-size:12px;font-weight:400;color:var(--tx3);margin-left:5px}
.tcard .td{font-size:12px;color:var(--tx3);margin-top:6px;line-height:1.5}

.close{margin-top:34px;padding:20px 22px;border-radius:14px;
  background:linear-gradient(180deg,#17140A,#111110);border:1px solid rgba(255,199,44,.22)}
.close .cl{font-size:12px;color:var(--tx3);letter-spacing:1.4px;margin-bottom:8px}
.close .cm{font-size:15px;color:var(--tx);line-height:1.7}
.close .cm b{font-size:22px;color:var(--y);letter-spacing:-.3px}
.close .cd{font-size:12.5px;color:var(--tx3);margin-top:10px;line-height:1.6}
.member{margin-top:14px;padding-top:13px;border-top:1px solid rgba(255,255,255,.06);
  font-size:12.5px;color:var(--tx2);line-height:1.65}
.member b{color:var(--tx);font-weight:600}
.member .yes{color:var(--y);font-weight:700}
.member .no{color:var(--red-lt);font-weight:700}

.card{margin-top:34px;padding:22px 24px;border-radius:16px;background:#0F0F11;border:1px dashed #34343A}
.card .ch{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx3);letter-spacing:1.6px;margin-bottom:14px}
.card ol{margin:0;padding-left:19px;font-size:14.5px;line-height:2}
.card ol li::marker{color:var(--tx3);font-size:12px}
.card .cf{margin-top:14px;padding-top:12px;border-top:1px solid #1E1E22;font-size:11.5px;color:var(--tx3)}

.relation-note{margin-top:16px;font-size:13px;color:var(--tx2);line-height:1.7;
  padding:13px 16px;border-radius:10px;background:#131315;border:1px solid var(--line)}
.relation-note b{color:var(--tx);font-weight:600}

.warn{margin-top:20px;padding:13px 16px;border-radius:10px;font-size:12.5px;line-height:1.7;
  background:var(--red-dim);border:1px solid rgba(218,41,28,.28);color:#E7A79E}
.warn b{color:#F0715F}

/* 「还没定」但另一套走不通时的说明：不置灰、不喊口号，只把原因摊开 */
.deadline{margin-top:22px;padding:15px 17px;border-radius:12px;
  background:#111113;border:1px solid var(--line2);line-height:1.75;font-size:12.5px}
.deadline b{display:block;font-size:13.5px;color:var(--tx);font-weight:600;margin-bottom:5px}
.deadline span{display:block;color:#B9B9BF}
.deadline i{display:block;margin-top:8px;font-style:normal;color:var(--tx3);font-size:11.5px}

.foot{margin-top:56px;font-size:11px;color:#4E4E54;line-height:1.9;border-top:1px solid var(--line);padding-top:20px}
.foot b{color:var(--tx3);font-weight:500}
.foot .met{color:var(--y);font-variant-numeric:tabular-nums}

@media(max-width:640px){
  .screen{padding:0 20px 60px}
  .hero{padding:30px 0 40px}
  .hero-in{padding:0 20px}
  .h1{font-size:34px;margin:34px 0 12px}
  .formwrap{padding-top:34px}
  .verdict .vt{font-size:23px}
  .transit{grid-template-columns:1fr}
  .tbl td.tg{display:none}
  .seg small{display:none}
  .wrow{grid-template-columns:1fr 52px 78px;gap:10px}
}
</style>
</head>
<body>

<!-- ==================== 第一屏：填信息 ==================== -->
<main id="screen-form">

<section class="hero">
  <div class="hero-in">
  <div class="brand">
    <svg class="arch" viewBox="0 0 200 132" xmlns="http://www.w3.org/2000/svg" aria-label="金拱门">
      <path d="M16 116 C16 34 32 16 60 16 C88 16 100 44 100 116 C100 44 112 16 140 16 C168 16 184 34 184 116"
            fill="none" stroke="#FFC72C" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div>
      <div class="bn">AfterM</div>
      <div class="bs">麦麦散场局</div>
    </div>
  </div>

  <h1 class="h1">散场了，<br>这顿<em>怎么吃</em></h1>
  <p class="sub">填五件事，剩下的账我们来算。</p>
  </div>
</section>

<div class="screen formwrap">
  <form id="form" autocomplete="off">

    <div class="sec-label">必填</div>

    <div class="field">
      <label>当前地址<span class="lab-note">你现在在哪</span></label>
      <div class="row">
        <input class="inp" id="addr" placeholder="如：杭州市滨江区飞虹路3号（杭州奥体中心）">
      </div>
      <div class="chip-note">带上城市名和门牌号最准。系统会用它找最近的麦当劳。</div>
    </div>

    <div class="field">
      <label>落脚点地址<span class="lab-note">外卖送到这 · 堂食吃完去这</span></label>
      <div class="row">
        <input class="inp" id="drop" placeholder="如：飞虹路208号 奥体中心希尔顿欢朋">
        <button type="button" class="mini" id="dropRead">从 App 读取</button>
      </div>
      <div class="chip-note" id="dropNote"><b>外卖只认 App 里存过的地址</b>，手打的不算，点右边「从 App 读取」挑一个</div>
    </div>

    <div class="field">
      <label>散场时间</label>
      <div class="row">
        <input class="inp" id="when" placeholder="如：2026-10-24 21:15">
        <button type="button" class="mini" id="whenNow">用此刻</button>
      </div>
      <div class="chip-note" id="whenNote">写全日期加时间　<span class="auto" id="whenCal"></span></div>
    </div>

    <div class="field">
      <label>人数</label>
      <div class="stepper">
        <button type="button" data-step="-1">−</button>
        <div class="num" id="num">3</div>
        <button type="button" data-step="1">+</button>
        <span class="unit">人</span>
      </div>
    </div>

    <div class="field">
      <label>怎么吃</label>
      <div class="seg3" id="segForm">
        <button type="button" class="seg on" data-val="dinein">堂食<small>就近坐下吃</small></button>
        <button type="button" class="seg" data-val="delivery">外卖<small>送到落脚点</small></button>
        <button type="button" class="seg" data-val="undecided">还没定<small>两套都算给你</small></button>
      </div>
    </div>

    <div class="sel-sec">
      <div class="sec-label">选填<span>补了，方案更准</span></div>

      <div class="field">
        <label>偏好 / 忌口<span class="lab-note">斜杠前＝想吃，斜杠后＝不能碰</span></label>
        <input class="inp" id="taste" placeholder="如：想吃麦辣鸡翅 / 不想吃冰的冷的">
        <div class="chip-note">也支持 控卡 / 素食 / 过敏原 / 儿童餐　·　写反了也没事，带「不 / 忌 / 过敏」的一律当忌口</div>
      </div>

      <div class="field">
        <label>价格预期</label>
        <div class="price-row">
          <input class="price-inp" id="budget" placeholder="不限">
          <span class="unit">元 / 人</span>
          <div class="quick">
            <button type="button" data-budget="30">30</button>
            <button type="button" data-budget="40">40</button>
            <button type="button" data-budget="50">50</button>
            <button type="button" data-budget="">不限</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label>人物关系</label>
        <div class="chips" id="rel">
          <button type="button" class="chip" data-val="恋人">恋人</button>
          <button type="button" class="chip" data-val="同事">同事</button>
          <button type="button" class="chip" data-val="一家三口">一家三口</button>
          <button type="button" class="chip" data-val="同学">同学</button>
          <button type="button" class="chip" data-val="朋友">朋友</button>
        </div>
        <input class="inp" id="relFree" placeholder="其他，直接写（如：我和我女朋友还有她闺蜜）"
               style="margin-top:14px;font-size:15px;font-weight:400">
        <div class="chip-note" id="relNote">不填按各吃各的算，不会替你猜</div>
      </div>

      <div class="field" style="padding-bottom:6px">
        <label>疲劳度</label>
        <div class="chips" id="tired">
          <button type="button" class="chip" data-val="轻松">轻松</button>
          <button type="button" class="chip on" data-val="适中">适中</button>
          <button type="button" class="chip" data-val="疲劳">很累</button>
        </div>
      </div>
    </div>

    <div class="formerr" id="fileErr" hidden></div>
    <button class="cta" type="submit" id="submit">看方案</button>
    <div class="form-foot">只读查询，不会下单、不会领券、不会动你的地址</div>
  </form>
</div>
</main>

<!-- ==================== 计算中 ==================== -->
<main class="screen loading" id="screen-load" hidden>
  <div class="ld-num" id="ldNum">0.0<small>秒</small></div>
  <div class="ld-bar"><i></i></div>
  <div class="ld-tip" id="ldTip">正在找最近的麦当劳…</div>
  <div class="ld-sub">实时查价、实时算路，通常 5 秒内出结果</div>
</main>

<!-- ==================== 第二屏：方案 ==================== -->
<main class="screen" id="screen-result" hidden>

  <div class="topbar">
    <button class="back" id="back">← 改条件</button>
    <div class="sumchips" id="sumchips"></div>
  </div>

  <div class="lazybar"><i class="lb-dash"></i><span id="lazyTxt">不想看长文？<b>只读下面这一句</b>就够点单了。</span></div>

  <div class="vcard">
    <svg class="vwm" viewBox="0 0 200 132" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M16 116 C16 34 32 16 60 16 C88 16 100 44 100 116 C100 44 112 16 140 16 C168 16 184 34 184 116"
            fill="none" stroke="#FFC72C" stroke-width="16" stroke-linecap="round"/>
    </svg>
    <div class="vlabel" id="vlabel">本单结论</div>
    <div class="verdict" id="verdict"></div>
  </div>

  <div class="switch" id="switch" hidden></div>

  <div id="warnbox"></div>

  <section id="pane-dinein" hidden></section>
  <section id="pane-delivery" hidden></section>

  <div class="foot" id="foot"></div>
</main>

<script>
/* ==========================================================================
   状态
   ========================================================================== */
var state = {
  form: 'dinein', people: 3, rel: '', tired: '适中',
  budget: '', taste: '', wk: '', hhmm: '', drop: '', addr: '',
  data: null, pane: 'dinein'
};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function money(v){
  if(v == null) return '—';
  return (Math.abs(v - Math.round(v)) < 0.004) ? ('¥' + Math.round(v)) : ('¥' + v.toFixed(2));
}
/* 摘要条里的地址：先剥省市区，再按字数截 —— 直接 slice(0,12) 会截成「富城路33」，看着像没打完 */
function shortAddr(s){
  var t = String(s || '').replace(/\s+/g, '')
    .replace(/^.*?(省|自治区|特别行政区)/, '')
    .replace(/^.*?市/, '')
    .replace(/^.*?(区|县|旗)/, '');
  return t.length > 14 ? t.slice(0, 14) + '…' : t;
}

/* 数据入口都走这两个函数。本地跑是真请求；
   演示版（GitHub Pages）由注入脚本接管，返回同结构的真实运行快照。 */
function apiAddresses(){
  if(window.__DEMO__ && window.demoAddresses) return window.demoAddresses();
  return fetch('/api/addresses').then(function(r){ return r.json(); });
}
function planFetch(req){
  if(window.__DEMO__ && window.demoPlan) return window.demoPlan(req);
  return fetch('/api/plan', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(req)
  }).then(function(r){ return r.json(); });
}

/* ==========================================================================
   第一屏交互
   ========================================================================== */
function pad(n){ return n < 10 ? '0' + n : '' + n; }

$('whenNow').addEventListener('click', function(){
  var d = new Date();
  $('when').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                  + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  updWhen();
});

function updWhen(){
  var v = $('when').value.trim();
  var el = $('whenCal');
  var m = v.match(/(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);
  if(!m){ el.textContent = v ? '· 缺日期，写成 2026-10-24 21:15' : ''; state.wk = ''; return; }
  var d = new Date(+m[1], +m[2] - 1, +m[3]);
  var t = v.match(/(\d{1,2}:\d{2})/);
  state.wk = '周' + '日一二三四五六'.charAt(d.getDay());
  state.hhmm = t ? t[1] : '';
  el.textContent = '· 自动识别 ' + state.wk + (state.hhmm ? ' ' + state.hhmm : '');
}
$('when').addEventListener('input', updWhen);

/* 落脚点能不能送外卖 —— 在输入的时候就告诉他，别等算完才发现 */
var _saved = null;
function _normA(s){
  return (s || '').replace(/\s/g, '')
    .replace(/(放前台|到酒店|电话联系|打电话联系|打电话).*$/, '');
}
function _gramOf(s){
  s = _normA(s);
  var g = {};
  for(var i = 0; i < s.length - 1; i++) g[s.slice(i, i + 2)] = 1;
  return g;
}
function addrMatch(v){
  if(!_saved || !_saved.length || !v) return null;
  var gi = _gramOf(v), keys = Object.keys(gi);
  if(!keys.length) return null;
  var best = null, bestR = 0;
  _saved.forEach(function(a){
    var ga = _gramOf(a.text);
    var n = keys.filter(function(k){ return ga[k]; }).length;
    var r = n / keys.length;
    if(r > bestR){ bestR = r; best = a; }
  });
  return bestR >= 0.5 ? best : null;
}
apiAddresses().then(function(j){
  _saved = (j && j.ok && j.addresses) ? j.addresses : [];
}).catch(function(){ _saved = []; });

$('drop').addEventListener('blur', function(){
  var v = this.value.trim();
  if(!v || _saved === null) return;
  if(addrMatch(v)){
    $('dropNote').innerHTML = '对上了 App 里存的地址　·　<b>外卖能算</b>';
  } else if(_saved.length){
    $('dropNote').innerHTML = '<span style="color:#F0715F">App 里没这个地址，外卖这条路算不了，只出堂食。</span>' +
      '　外送接口只认地址簿里的 addressId，不认手打的字 —— 想点外卖先去麦当劳 App 存一下。';
  }
});

/* 从 App 读地址 */
$('dropRead').addEventListener('click', function(){  var b = this;
  b.textContent = '读取中…'; b.disabled = true;
  apiAddresses().then(function(j){
    b.textContent = '从 App 读取'; b.disabled = false;
    if(!j.ok || !j.addresses || !j.addresses.length){
      $('dropNote').innerHTML = '<span style="color:#F0715F">麦当劳 App 里没有存过外送地址，先去 App 加一个。</span>';
      return;
    }
    var html = '点一个填进去：' + j.addresses.map(function(a, i){
      return '<button type="button" class="mini" style="margin:6px 6px 0 0" data-ad="' + i + '">'
        + esc(a.text.slice(0, 26)) + '</button>';
    }).join('');
    $('dropNote').innerHTML = html;
    $('dropNote').querySelectorAll('[data-ad]').forEach(function(btn){
      btn.addEventListener('click', function(){
        $('drop').value = j.addresses[+btn.dataset.ad].text;
        state.drop = $('drop').value;
        $('dropNote').textContent = '已填入 · 外卖能算。要换就再点一次「从 App 读取」。';
      });
    });
  }).catch(function(){
    b.textContent = '从 App 读取'; b.disabled = false;
    $('dropNote').textContent = '读不到地址，确认本地服务在跑、token 没过期。';
  });
});

document.querySelectorAll('#segForm .seg').forEach(function(b){
  b.addEventListener('click', function(){
    document.querySelectorAll('#segForm .seg').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    state.form = b.dataset.val;
  });
});

document.querySelectorAll('.stepper button').forEach(function(b){
  b.addEventListener('click', function(){
    state.people = Math.max(1, Math.min(10, state.people + parseInt(b.dataset.step, 10)));
    $('num').textContent = state.people;
    updateRelState();
  });
});

function updateRelState(){
  var one = state.people === 1;
  document.querySelectorAll('#rel .chip').forEach(function(c){ c.disabled = one; });
  $('relFree').disabled = one;
  $('relNote').textContent = one ? '1 个人没有关系可填' : '不填按各吃各的算，不会替你猜';
  if(one){
    document.querySelectorAll('#rel .chip').forEach(function(c){ c.classList.remove('on'); });
    $('relFree').value = ''; state.rel = '';
  }
}
document.querySelectorAll('#rel .chip').forEach(function(c){
  c.addEventListener('click', function(){
    var was = c.classList.contains('on');
    document.querySelectorAll('#rel .chip').forEach(function(x){ x.classList.remove('on'); });
    if(!was){ c.classList.add('on'); state.rel = c.dataset.val; }
    else { state.rel = ''; }
  });
});
$('relFree').addEventListener('input', function(e){
  if(e.target.value.trim()){
    document.querySelectorAll('#rel .chip').forEach(function(x){ x.classList.remove('on'); });
    state.rel = 'free:' + e.target.value.trim();
  } else if(state.rel.indexOf('free:') === 0){ state.rel = ''; }
});
document.querySelectorAll('#tired .chip').forEach(function(c){
  c.addEventListener('click', function(){
    document.querySelectorAll('#tired .chip').forEach(function(x){ x.classList.remove('on'); });
    c.classList.add('on'); state.tired = c.dataset.val;
  });
});
/* 价格预期：和下面的人物关系、疲劳度用同一套 chip 交互 —— 点一下亮，
   再点一下取消；手输数字也能反点亮对应的那个。 */
function syncBudget(){
  var v = ($('budget').value || '').trim();
  document.querySelectorAll('.quick button').forEach(function(b){
    b.classList.toggle('on', (b.dataset.budget || '') === v);
  });
}
document.querySelectorAll('.quick button').forEach(function(b){
  b.addEventListener('click', function(){
    var was = b.classList.contains('on');
    document.querySelectorAll('.quick button').forEach(function(x){ x.classList.remove('on'); });
    if(was){ $('budget').value = ''; }
    else { $('budget').value = b.dataset.budget; b.classList.add('on'); }
  });
});
$('budget').addEventListener('input', syncBudget);
syncBudget();

/* 一开始填就把红边撤掉，别让框一直挂着错误态 */
['addr', 'drop', 'when'].forEach(function(id){
  $(id).addEventListener('input', function(){ $(id).classList.remove('err'); });
});

/* ==========================================================================
   提交 → 计算 → 渲染
   ========================================================================== */
var TIPS = [
  '正在找最近的麦当劳…',
  '在比套餐和单品哪个划算…',
  '逐个试真实价格…',
  '算走、骑、坐车分别要多久…',
  '对一遍券能不能用…',
  '快好了，正在收口…'
];

$('form').addEventListener('submit', function(e){
  e.preventDefault();
  updWhen();

  var req = {
    from_addr: $('addr').value.trim(),
    to_addr: $('drop').value.trim(),
    when: $('when').value.trim(),
    people: state.people,
    form: state.form,
    taste: $('taste').value.trim(),
    budget: $('budget').value.trim(),
    rel: state.rel,
    tired: state.tired
  };
  /* 必填校验：一次说清缺哪几项、能点、滚到第一个、框加红边。
     陌生人第一下就点提交是常态，不能只让光标悄悄跳一下。 */
  var miss = [];
  if(!req.from_addr) miss.push(['addr', '当前地址']);
  if(!req.to_addr) miss.push(['drop', '落脚点地址']);
  if(!req.when) miss.push(['when', '散场时间']);
  ['addr', 'drop', 'when'].forEach(function(id){ $(id).classList.remove('err'); });

  if(miss.length){
    var box = $('fileErr');
    box.hidden = false;
    box.innerHTML = '<b>还差 ' + miss.length + ' 项，点名字直接跳过去</b>' +
      miss.map(function(m){ return '<span data-jump="' + m[0] + '">' + m[1] + '</span>'; }).join('');
    miss.forEach(function(m){ $(m[0]).classList.add('err'); });
    box.querySelectorAll('[data-jump]').forEach(function(el){
      el.addEventListener('click', function(){
        var t = $(el.dataset.jump);
        t.scrollIntoView({ behavior: 'smooth', block: 'center' });
        try{ t.focus({ preventScroll: true }); }catch(e){ t.focus(); }
      });
    });
    var first = $(miss[0][0]);
    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
    setTimeout(function(){
      try{ first.focus({ preventScroll: true }); }catch(e){ first.focus(); }
    }, 320);
    return;
  }
  $('fileErr').hidden = true;
  state.drop = req.to_addr;

  $('screen-form').hidden = true;
  $('screen-load').hidden = false;
  window.scrollTo({ top: 0, behavior: 'instant' });

  var t0 = Date.now(), ti = 0;
  var timer = setInterval(function(){
    $('ldNum').innerHTML = ((Date.now() - t0) / 1000).toFixed(1) + '<small>秒</small>';
    var k = Math.min(TIPS.length - 1, Math.floor((Date.now() - t0) / 900));
    if(k !== ti){ ti = k; $('ldTip').textContent = TIPS[k]; }
  }, 100);

  planFetch(req).then(function(j){
    clearInterval(timer);
    state.data = j;
    state.req = req;
    /* 默认显示能算出来的那一套；两套都成时先看堂食 */
    var pp = j.panes || {};
    state.pane = (pp.dinein && pp.dinein.ok) ? 'dinein'
               : (pp.delivery && pp.delivery.ok) ? 'delivery'
               : (pp.dinein ? 'dinein' : 'delivery');
    $('screen-load').hidden = true;
    $('screen-result').hidden = false;
    render();
    window.scrollTo({ top: 0, behavior: 'instant' });
  }).catch(function(err){
    clearInterval(timer);
    $('screen-load').hidden = true;
    $('screen-result').hidden = false;
    /* 算不出来就别留那张空的大卡片 —— 一张黑底金边的空卡比报错更像坏了 */
    var vc = document.querySelector('.vcard'); if(vc) vc.hidden = true;
    var lb = document.querySelector('.lazybar'); if(lb) lb.hidden = true;
    $('warnbox').innerHTML = '<div class="warn"><b>请求失败</b>　' + esc(err) +
      '　·　确认本地服务还在跑（终端那个窗口没关）。</div>';
  });
});

$('back').addEventListener('click', function(){
  $('screen-result').hidden = true;
  $('screen-form').hidden = false;
  window.scrollTo({ top: 0, behavior: 'instant' });
});

/* ---------- 渲染 ---------- */
function render(){
  var j = state.data, req = state.req;
  var vc = document.querySelector('.vcard'); if(vc) vc.hidden = false;
  var lb = document.querySelector('.lazybar'); if(lb) lb.hidden = false;
  var pans = j.panes || {};
  var isUndecided = req.form === 'undecided';

  /* 摘要条 */
  var chips = [req.people + ' 人'];
  if(j.echo && j.echo.weekday) chips.push(j.echo.weekday + ' ' + (req.when.split(' ')[1] || '') + ' 散场');
  chips.push(req.form === 'dinein' ? '堂食' : req.form === 'delivery' ? '外卖' : '还没定');
  if(req.to_addr) chips.push('→ ' + shortAddr(req.to_addr));
  if(req.budget) chips.push('人均 ¥' + req.budget);
  $('sumchips').innerHTML = chips.map(function(t){
    return '<span class="sumchip">' + esc(t) + '</span>';
  }).join('');

  /* 焦点标签 + 懒人行 */
  var bothOk = !!(isUndecided && pans.dinein && pans.dinein.ok && pans.delivery && pans.delivery.ok);
  $('vlabel').textContent = bothOk ? '两套结论' : (isUndecided ? '先走通这一套' : '本单结论');
  $('lazyTxt').innerHTML = bothOk
    ? '不想看长文？<b>只读下面这两行</b>就够点单了。'
    : '不想看长文？<b>只读下面这一句</b>就够点单了。';

  /* 一句话 */
  var v = $('verdict');
  if(isUndecided && pans.dinein && pans.dinein.ok && pans.delivery && pans.delivery.ok){
    var a = pans.dinein.best, b = pans.delivery.best;
    var diff = b.price - a.price;
    v.innerHTML =
      '<p class="vlead">同一顿饭，人均差 <span class="dgap">' + money(diff / req.people) + '</span>' +
        ' —— 换的是「多跑一趟」还是「多花这钱」。</p>' +
      '<div class="vrow"><div class="k">堂食</div>' +
        '<div class="v">' + pans.dinein.verdict.lead + '</div>' +
        '<div class="vp">' + money(a.per) + '<small>/人</small></div></div>' +
      '<div class="vrow"><div class="k">外卖</div>' +
        '<div class="v">' + pans.delivery.verdict.lead + '</div>' +
        '<div class="vp">' + money(b.per) + '<small>/人</small></div></div>' +
      '<div class="vs" style="margin-top:16px">两套都算好了，点上面的按钮切，随时能换回来。</div>';
  } else if(pans[state.pane] && pans[state.pane].ok){
    var pd = pans[state.pane];
    v.innerHTML =
      '<p class="vt">' + pd.verdict.lead + '</p>' +
      '<div class="vmeta"><span class="vprice">' + money(pd.verdict.price) + '</span>' +
        '<span class="vper">' + req.people + ' 人 · <b>人均 ' + money(pd.verdict.per) + '</b></span></div>' +
      '<div class="vtags">' + (pd.verdict.tags || []).map(function(t){
        return '<span class="' + (t.k || '') + '">' + esc(t.t) + '</span>';
      }).join('') + '</div>';
  } else {
    var err = (pans[state.pane] || {}).error || (j.warnings || [])[0] || '没算出可行方案。';
    v.innerHTML = '<p class="vt">这次没算出来。</p><div class="vs">' + esc(err) + '</div>';
  }

  /* 「还没定」但只走通一套时，把另一套为什么走不通说出来。
     不显示就等于默认只剩一套 —— 用户明明问的是两条路。 */
  if(isUndecided && !bothOk){
    var liveKey = (pans.dinein && pans.dinein.ok) ? 'dinein'
                : (pans.delivery && pans.delivery.ok) ? 'delivery' : null;
    var deadKey = liveKey === 'dinein' ? 'delivery' : liveKey === 'delivery' ? 'dinein' : null;
    var dead = deadKey ? pans[deadKey] : null;
    if(dead && !dead.ok){
      var deadName = deadKey === 'delivery' ? '外卖' : '堂食';
      var ads = (dead.addresses && dead.addresses.length)
        ? '<i>你现在存过的是：' + dead.addresses.map(function(x){ return esc(x.trim()); }).join('　·　') + '</i>'
        : '';
      v.innerHTML += '<div class="deadline"><b>' + deadName + '这条这会儿走不通</b>' +
        '<span>' + esc(dead.error || '没算出可行方案。') + '</span>' + ads +
        '<i>所以上面只给了一套。想比两套，先把这条路打通再看。</i></div>';
    }
  }

  /* 切换器：只有「还没定」出现，且两套都成 */
  var sw = $('switch');
  if(isUndecided && pans.dinein && pans.delivery && pans.dinein.ok && pans.delivery.ok){
    sw.hidden = false;
    sw.innerHTML =
      '<button data-pane="dinein" class="' + (state.pane === 'dinein' ? 'on' : '') + '">堂食' +
        '<span class="sp">合计 ' + money(pans.dinein.best.price) + '</span></button>' +
      '<button data-pane="delivery" class="' + (state.pane === 'delivery' ? 'on' : '') + '">外卖' +
        '<span class="sp">合计 ' + money(pans.delivery.best.price) + '</span></button>';
    sw.querySelectorAll('button').forEach(function(b){
      b.addEventListener('click', function(){
        state.pane = b.dataset.pane;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });
  } else { sw.hidden = true; sw.innerHTML = ''; }

  /* 全局提醒 */
  var wb = [];
  (j.warnings || []).forEach(function(w){ wb.push(w); });
  $('warnbox').innerHTML = wb.length
    ? '<div class="warn">' + wb.map(function(w){ return '<b>注意</b>　' + esc(w); }).join('<br>') + '</div>'
    : '';

  /* 面板 */
  var showPane = isUndecided ? state.pane : (pans.dinein && pans.dinein.ok ? 'dinein' : 'delivery');
  $('pane-dinein').hidden = showPane !== 'dinein';
  $('pane-delivery').hidden = showPane !== 'delivery';
  $('pane-dinein').innerHTML = pans.dinein ? paneHTML('dinein', pans.dinein, req) : '';
  $('pane-delivery').innerHTML = pans.delivery ? paneHTML('delivery', pans.delivery, req) : '';

  /* 脚注：把耗时打出来 */
  $('foot').innerHTML =
    '<b>这套数从哪来</b>：门店、套餐、价格来自麦当劳 MCP 实时试价；距离、耗时、打车价来自高德。<br>' +
    '<b>只读</b>：不下单、不领券、不建地址。到手温度这类按常识判断，不是接口数据。<br>' +
    '本次计算 <span class="met">' + ((j.took_ms || 0) / 1000).toFixed(1) + ' 秒</span>' +
    (j.calls ? '　·　麦当劳接口 <span class="met">' + j.calls + ' 次</span>' : '') +
    (j.now ? '　·　参照时间 ' + esc(j.now.date + ' ' + j.now.hhmm + ' ' + j.now.weekday) : '');
}

function prefBarHTML(rep, kind){
  var h = '';
  var hit = rep.hit || [], miss = rep.missing || [], avoidIn = rep.avoid_in || [];
  if(hit.length){
    h += '<div class="pf ok"><b>有' + esc(hit.join('、')) + '</b>' +
         '<span>' + (kind === 'dinein' ? '下面是含这个的买法' : '会跟这单一起送到') + '</span></div>';
  }
  if(miss.length){
    var why = rep.later ? '换个时段才有' : '这会儿的菜单里没有';
    h += '<div class="pf miss"><b>没有' + esc(miss.join('、')) + '</b>' +
         '<span>' + why + '　·　下面是没有这口的兜底</span></div>';
  }
  if(avoidIn.length){
    h += '<div class="pf warn"><b>' + (rep.all_avoid ? '每个方案都含' : '有方案含') +
         '「' + esc(avoidIn.join('、')) + '」</b>' +
         '<span>自己挑一个能接受的，或者点左上角「改条件」回去改</span></div>';
  }
  return h ? '<div class="prefwrap">' + h + '</div>' : '';
}

function paneHTML(kind, p, req){
  if(!p.ok){
    return '<div class="block"><div class="warn"><b>这套算不出</b>　' + esc(p.error || '未知原因') +
      (p.addresses && p.addresses.length
        ? '<br><br>账号里现有的地址：<br>' + p.addresses.map(function(a){ return '· ' + esc(a); }).join('<br>')
        : '') + '</div></div>';
  }

  var h = '';

  /* 01 券 */
  h += '<div class="block"><div class="bh"><span class="idx">01</span><span class="bt">券</span>' +
       '<span class="bj">' + (p.coupons.at_store.length ? p.coupons.at_store.length + ' 张可用' : '本单 0 张可用') +
       '</span></div>' +
       '<div class="coupon"><div class="ci">券</div><div class="ct">' +
       esc(p.coupons.head) + '<br><span class="dim">' + esc(p.coupons.detail) + '</span></div></div></div>';

  /* 偏好兑现情况：放在买法表正上方 —— 它决定这张表怎么读 */
  if(p.pref && !p.pref.empty){
    h += prefBarHTML(p.pref, kind);
  }

  /* 02 买法比价 */
  h += '<div class="block"><div class="bh"><span class="idx">02</span><span class="bt">买法比价</span>' +
       '<span class="bj">' + (kind === 'dinein' ? '到店价' : '外送价') + ' · ' + req.people + ' 人</span></div>' +
       '<table class="tbl"><thead><tr><th>买法</th><th class="r">合计</th><th class="tg">优点</th></tr></thead><tbody>';
  p.plans.forEach(function(pl){
    h += '<tr><td class="nm">' + esc(pl.label) +
         '<span class="sub2">' + esc(pl.note) + '</span></td>' +
         '<td class="pr">' + money(pl.price) + '<span class="pp">人均 ' + money(pl.per) + '</span></td>' +
         '<td class="tg">' + (pl.tags || []).map(function(t){
            return '<span class="tag ' + tagCls(t.k) + '">' + esc(t.t) + '</span>';
         }).join('') + '</td></tr>';
  });
  h += '</tbody></table></div>';

  /* 03 交通 / 送到哪 */
  if(kind === 'dinein'){
    h += '<div class="block"><div class="bh"><span class="idx">03</span><span class="bt">怎么去</span>' +
         '<span class="bj">' + esc(p.store.name.replace('麦当劳', '')) + '</span></div>';
    h += '<div class="ways"><div class="whead">' + p.ways.head + '</div>';
    (p.ways.rows || []).forEach(function(r){
      h += '<div class="wrow' + (r.best ? ' best' : '') + '">' +
           '<div class="wn">' + esc(r.name) +
             (r.tag ? '<span class="tag t-best">' + esc(r.tag) + '</span>' : '') +
             (r.per_leg ? '<small>' + esc(r.per_leg) + '</small>' : '') +
           '</div>' +
           '<div class="wt">' + r.min + ' 分</div>' +
           '<div class="wc">' + esc(r.cost_text) + '</div></div>';
    });
    h += '</div><div class="waynote">' + p.ways.note + '</div></div>';
  } else {
    var wb2 = p.ways && p.ways.best;
    h += '<div class="block"><div class="bh"><span class="idx">03</span><span class="bt">送到哪</span>' +
         '<span class="bj">含运费 · 打包费</span></div>' +
         '<div class="transit">' +
         '<div class="tcard"><div class="tt">送到</div><div class="tv">' +
           esc(p.delivery.to || '落脚点') + '</div><div class="td">' + esc(p.delivery.note) + '</div></div>' +
         '<div class="tcard"><div class="tt">你自己过去</div><div class="tv">' +
           (wb2 ? wb2.min + ' 分<small>' + esc(wb2.cost_text) + '</small>' : '—') +
           '</div><div class="td">点外卖就不用跑；这段是给堂食做对照的</div></div>' +
         '</div>';
    if(p.ways && p.ways.rows && p.ways.rows.length){
      h += '<div class="ways" style="margin-top:16px"><div class="whead">' + p.ways.head + '</div>';
      p.ways.rows.forEach(function(r){
        h += '<div class="wrow' + (r.best ? ' best' : '') + '">' +
             '<div class="wn">' + esc(r.name) +
               (r.tag ? '<span class="tag t-best">' + esc(r.tag) + '</span>' : '') +
               (r.per_leg ? '<small>' + esc(r.per_leg) + '</small>' : '') +
             '</div><div class="wt">' + r.min + ' 分</div>' +
             '<div class="wc">' + esc(r.cost_text) + '</div></div>';
      });
      h += '</div><div class="waynote">' + p.ways.note + '</div></div>';
    } else { h += '</div>'; }
  }

  /* 收口 */
  h += '<div class="close"><div class="cl">收口</div><div class="cm">' + p.close.main + '</div>' +
       '<div class="cd">' + esc(p.close.detail) + '</div>';
  if(p.card){
    h += '<div class="member">💳 <b>麦金卡</b>：' + p.card.text +
         (p.card.hint ? '<br><span style="color:#5E5E64">（' + esc(p.card.hint) + '）</span>' : '') + '</div>';
  }
  h += '</div>';

  /* 行动卡 */
  h += '<div class="card"><div class="ch">🍔 ' + esc(p.action.title) + '</div><ol>' +
       p.action.steps.map(function(s){ return '<li>' + esc(s) + '</li>'; }).join('') +
       '</ol><div class="cf">' + esc(p.action.foot) + '</div></div>';

  /* 关系 */
  if(p.rel){
    h += '<div class="relation-note"><b>关系</b> · ' + p.rel + '</div>';
  }
  return h;
}

function tagCls(k){
  if(k === 'best') return 't-best';
  if(k === 'hot' || k === 'gap') return 't-hot';
  return 't-gray';
}

/* 启动 */
updateRelState();
updWhen();
var d = new Date();
$('when').value = d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate())
                + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
updWhen();

/* --------------------------------------------------------------------------
   深链预填：?from=…&to=…&people=3&form=undecided&go=1
   用来分享一次查询，也方便自动化截图；不填任何参数就跟平时一样。
   -------------------------------------------------------------------------- */
(function(){
  var q = new URLSearchParams(location.search);
  if(!q.toString()) return;
  if(q.get('from')) $('addr').value = q.get('from');
  if(q.get('to'))   $('drop').value = q.get('to');
  if(q.get('when')) $('when').value = q.get('when');
  if(q.get('taste'))$('taste').value = q.get('taste');
  if(q.get('budget'))$('budget').value = q.get('budget');
  if(q.get('people')){
    state.people = Math.max(1, Math.min(10, parseInt(q.get('people'), 10) || 1));
    $('num').textContent = state.people;
    updateRelState();
  }
  if(q.get('form')){
    state.form = q.get('form');
    document.querySelectorAll('#segForm .seg').forEach(function(x){
      x.classList.toggle('on', x.dataset.val === state.form);
    });
  }
  updWhen();
  if(q.get('go') === '1'){
    setTimeout(function(){ $('form').dispatchEvent(new Event('submit', {cancelable:true})); }, 60);
  }
})();
</script>
